---
# playbooks/rotate-vault-approle.yaml
# G6 — Ansible: Vault AppRole secret_id rotation via community.hashi_vault collection
# Session 2 of 2: Vault dynamic secrets + GitHub Actions secret update
#
# Prerequisites:
#   ansible-galaxy collection install community.hashi_vault
#
# Usage:
#   export VAULT_ROLE_ID=<role-id>
#   export VAULT_SECRET_ID=<current-secret-id>
#   ansible-playbook playbooks/rotate-vault-approle.yaml
#
# Run from GitHub Actions on a schedule or triggered by a Vault lease expiry event.
# References: docs/curriculum/master_transition_blueprint.md §Phase 4b

- name: Rotate Vault AppRole secret_id for inference-node role
  hosts: localhost
  gather_facts: false
  vars:
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.internal.example.com') }}"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
    github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('myorg/ai-platform-lab') }}"

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - vault_role_id | length > 0
          - vault_secret_id | length > 0
        fail_msg: "VAULT_ROLE_ID and VAULT_SECRET_ID must be set in environment"

    - name: Authenticate to Vault via AppRole
      community.hashi_vault.vault_login:
        url: "{{ vault_addr }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        validate_certs: true
      register: vault_login
      no_log: true   # never log the token

    - name: Generate new secret_id for inference-node AppRole
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_login.login.auth.client_token }}"
        path: "auth/approle/role/inference-node/secret-id"
        validate_certs: true
      register: new_secret_result
      no_log: true

    - name: Update GitHub Actions secret with new secret_id
      ansible.builtin.command:
        cmd: >
          gh secret set INFERENCE_VAULT_SECRET_ID
          --body "{{ new_secret_result.data.data.secret_id }}"
          --repo "{{ github_repo }}"
      environment:
        GH_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
      changed_when: true
      no_log: true

    - name: Revoke old secret_id
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_login.login.auth.client_token }}"
        path: "auth/token/revoke-accessor"
        data:
          accessor: "{{ vault_login.login.auth.accessor }}"
        validate_certs: true
      ignore_errors: true   # best-effort revocation — don't fail the playbook

    - name: Report rotation success
      ansible.builtin.debug:
        msg: >-
          Vault AppRole secret_id rotated successfully for inference-node role.
          New secret_id accessor: {{ new_secret_result.data.data.secret_id_accessor }}.
          GitHub secret INFERENCE_VAULT_SECRET_ID updated in {{ github_repo }}.
