# .github/secret_scanning.yml
# G5 — GitHub Advanced Security: custom secret patterns for the HashiCorp/SPIFFE stack.
# Enable secret scanning push protection in:
#   Repo Settings → Security → Secret scanning → Push protection → Enable
patterns:
  - name: HashiCorp Vault service token
    regex: "hvs\\.[A-Za-z0-9_-]{90,}"
    secret_type: "vault_service_token"

  - name: HashiCorp Boundary authentication token
    regex: "at_[a-z0-9]{10,}_[A-Za-z0-9]{40,}"
    secret_type: "boundary_auth_token"

  - name: SPIFFE SVID private key (EC)
    regex: "-----BEGIN EC PRIVATE KEY-----"
    secret_type: "spiffe_svid_ec_key"

  - name: Generic high-entropy base64 secret (>40 chars, common pattern)
    regex: "['\"](?:[A-Za-z0-9+/]{40,}={0,2})['\"]"
    secret_type: "high_entropy_base64"
