# .github/dependabot.yml
# G5 — GitHub Advanced Security: automated dependency update PRs
# Covers Python (uv/pip), Terraform providers, and GitHub Actions pinned SHAs.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "terraform"
    directory: "/ai-platform-lab/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
