---
# =============================================================================
# Vault Secret Injection Strategy — Context Forge MCP Gateway
#
# Three secrets Context Forge requires at startup, all injected by Vault Agent:
#
#   1. JWT_SECRET_KEY        (signs all issued bearer tokens)
#   2. AUTH_ENCRYPTION_SECRET (AES key for encrypting stored auth headers)
#   3. PLATFORM_ADMIN_PASSWORD (bootstrap admin account password)
#
# One secret the AI assistant requires:
#   4. MCPGATEWAY_BEARER_TOKEN (short-lived JWT to authenticate against Context Forge)
#      This is generated by a Vault Agent template that calls create_jwt_token
#      using the same JWT_SECRET_KEY and writes the token to a file.
#
# Secret paths in Vault KV-v2:
#   secret/data/ai-platform/context-forge/jwt-secret-key       → { "value": "<32-byte-hex>" }
#   secret/data/ai-platform/context-forge/auth-encryption-secret → { "value": "<32-byte-hex>" }
#   secret/data/ai-platform/context-forge/admin-password        → { "value": "<password>" }
#
# Bootstrap commands (run once against the lab Vault dev instance):
#   vault kv put secret/ai-platform/context-forge/jwt-secret-key \
#     value=$(openssl rand -hex 32)
#   vault kv put secret/ai-platform/context-forge/auth-encryption-secret \
#     value=$(openssl rand -hex 32)
#   vault kv put secret/ai-platform/context-forge/admin-password \
#     value=$(openssl rand -base64 24)
# =============================================================================

# ── Vault Policy: context-forge ───────────────────────────────────────────────
# This policy grants the context-forge ServiceAccount read access to its KV secrets.
# Applied as a ConfigMap so the Makefile bootstrap script can apply it:
#   vault policy write context-forge-policy - < /policy/context-forge-policy.hcl
apiVersion: v1
kind: ConfigMap
metadata:
  name: context-forge-vault-policy
  namespace: inference
  labels:
    app.kubernetes.io/name: context-forge
    app.kubernetes.io/component: vault-config
    platform.ai/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    platform.ai/bootstrap-note: >
      Apply this policy to Vault before deploying Context Forge:
        kubectl exec -n vault vault-0 -- vault policy write context-forge-policy \
          $(kubectl get cm context-forge-vault-policy -n inference -o jsonpath='{.data.policy\.hcl}')
data:
  policy.hcl: |
    # Context Forge secrets — read-only access to JWT signing key,
    # AES encryption secret, and admin bootstrap password.
    path "secret/data/ai-platform/context-forge/*" {
      capabilities = ["read"]
    }
    # Allow reading own secret metadata (for lease TTL inspection)
    path "secret/metadata/ai-platform/context-forge/*" {
      capabilities = ["read", "list"]
    }

---
# ── Vault Policy: ai-assistant-with-forge-token ───────────────────────────────
# The ai-assistant pod needs to read the Context Forge JWT_SECRET_KEY so it can
# generate its own bearer token via the create_jwt_token utility inside the
# Vault Agent template. It does NOT get access to any other context-forge secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-vault-policy
  namespace: inference
  labels:
    app.kubernetes.io/name: ai-assistant
    app.kubernetes.io/component: vault-config
    platform.ai/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  policy.hcl: |
    # AI Assistant policy: read the JWT signing key to generate its own bearer token.
    # The template below calls create_jwt_token locally and writes the output token
    # to /vault/secrets/context-forge-token — the key itself is never written to disk.
    path "secret/data/ai-platform/context-forge/jwt-secret-key" {
      capabilities = ["read"]
    }
    # Ollama API key (existing - from ADR-002)
    path "secret/data/ai-platform/ollama-api-key" {
      capabilities = ["read"]
    }

---
# =============================================================================
# Vault Agent Annotations — Context Forge Deployment
# =============================================================================
# These annotations are already present on the Deployment in
# context-forge-deployment.yaml. This document explains the full template logic
# and the _FILE convention used by Context Forge.
#
# Context Forge reads secret values from files when the environment variable
# name ends in _FILE. Example:
#   JWT_SECRET_KEY_FILE=/vault/secrets/jwt-secret-key
#   → Context Forge opens /vault/secrets/jwt-secret-key and uses its contents
#     as the JWT_SECRET_KEY value.
#
# This means the raw secret value is NEVER exposed as an env var (visible in
# `kubectl describe pod`), only as a file on a tmpfs mount.
#
# Full annotation block for context-forge Deployment (reference):
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: context-forge-vault-annotations-reference
  namespace: inference
  labels:
    platform.ai/managed-by: argocd
    platform.ai/doc-only: "true"
  annotations:
    platform.ai/note: >
      This ConfigMap is documentation only. The annotations are applied directly
      to the context-forge Deployment pod template in context-forge-deployment.yaml.
data:
  annotations.yaml: |
    # === APPLIED TO: context-forge Deployment pod template ===

    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "context-forge-role"
    vault.hashicorp.com/agent-revoke-on-shutdown: "true"
    vault.hashicorp.com/agent-revoke-grace: "30"

    # ── Secret 1: JWT_SECRET_KEY ─────────────────────────────────────────────
    vault.hashicorp.com/agent-inject-secret-jwt-secret-key: >-
      secret/data/ai-platform/context-forge/jwt-secret-key
    vault.hashicorp.com/agent-inject-template-jwt-secret-key: |
      {{- with secret "secret/data/ai-platform/context-forge/jwt-secret-key" -}}
      {{ .Data.data.value }}
      {{- end }}
    # Result: /vault/secrets/jwt-secret-key contains the raw 32-byte hex value.
    # Context Forge reads it via env: JWT_SECRET_KEY_FILE=/vault/secrets/jwt-secret-key

    # ── Secret 2: AUTH_ENCRYPTION_SECRET ─────────────────────────────────────
    vault.hashicorp.com/agent-inject-secret-auth-encryption-secret: >-
      secret/data/ai-platform/context-forge/auth-encryption-secret
    vault.hashicorp.com/agent-inject-template-auth-encryption-secret: |
      {{- with secret "secret/data/ai-platform/context-forge/auth-encryption-secret" -}}
      {{ .Data.data.value }}
      {{- end }}
    # Result: /vault/secrets/auth-encryption-secret

    # ── Secret 3: PLATFORM_ADMIN_PASSWORD ────────────────────────────────────
    vault.hashicorp.com/agent-inject-secret-admin-password: >-
      secret/data/ai-platform/context-forge/admin-password
    vault.hashicorp.com/agent-inject-template-admin-password: |
      {{- with secret "secret/data/ai-platform/context-forge/admin-password" -}}
      {{ .Data.data.value }}
      {{- end }}
    # Result: /vault/secrets/admin-password
    # Used for both PLATFORM_ADMIN_PASSWORD_FILE and BASIC_AUTH_PASSWORD_FILE

---
# =============================================================================
# Vault Agent Annotations — AI Assistant Deployment (UPDATED from ADR-006)
# =============================================================================
# The ai-assistant now needs a bearer token for Context Forge authentication
# IN ADDITION to the Ollama API key from ADR-006.
#
# The bearer token is generated inside a Vault Agent template using the
# python3 create_jwt_token utility. The utility runs within the vault-agent
# sidecar container (which has Python available in the hashicorp/vault image).
#
# If Python is NOT available in the vault-agent image:
#   Use the Context Forge JWT generation approach:
#   1. Bootstrap a long-lived service token via the Admin API
#   2. Store it in Vault KV: vault kv put secret/ai-platform/context-forge/service-token value=<token>
#   3. Inject it with a standard vault.hashicorp.com/agent-inject-secret-* annotation
#
# Template approach (preferred — dynamic token, auto-renews before expiry):
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-vault-annotations-reference
  namespace: inference
  labels:
    platform.ai/managed-by: argocd
    platform.ai/doc-only: "true"
data:
  annotations.yaml: |
    # === APPLIED TO: ai-assistant Deployment pod template ===
    # Replace the existing vault annotations block in deployments.yaml

    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "ai-assistant-forge-role"

    # ── Existing: Ollama API key (unchanged from ADR-002) ────────────────────
    vault.hashicorp.com/agent-inject-secret-ollama-api-key: >-
      secret/data/ai-platform/ollama-api-key
    vault.hashicorp.com/agent-inject-template-ollama-api-key: |
      {{- with secret "secret/data/ai-platform/ollama-api-key" -}}
      {{ .Data.data.key }}
      {{- end }}

    # ── New: Context Forge Bearer Token ─────────────────────────────────────
    # Approach A — Vault stores a pre-generated service token (simplest for lab):
    #   vault kv put secret/ai-platform/context-forge/service-token \
    #     value=$(curl -s -X POST http://context-forge:4444/auth/tokens \
    #       -H "Authorization: Bearer $ADMIN_TOKEN" \
    #       -d '{"username":"ai-assistant@platform","exp":0}' | jq -r .token)
    vault.hashicorp.com/agent-inject-secret-context-forge-token: >-
      secret/data/ai-platform/context-forge/service-token
    vault.hashicorp.com/agent-inject-template-context-forge-token: |
      {{- with secret "secret/data/ai-platform/context-forge/service-token" -}}
      {{ .Data.data.value }}
      {{- end }}
    # Result: /vault/secrets/context-forge-token
    # AI assistant reads via env: MCPGATEWAY_BEARER_TOKEN_FILE=/vault/secrets/context-forge-token
    #
    # Approach B — Dynamic token via template (requires Python in vault-agent image):
    # vault.hashicorp.com/agent-inject-template-context-forge-token: |
    #   {{- with secret "secret/data/ai-platform/context-forge/jwt-secret-key" -}}
    #   {{ exec "python3" "-m" "mcpgateway.utils.create_jwt_token"
    #       "--username" "ai-assistant@platform"
    #       "--exp" "60"
    #       "--secret" (.Data.data.value) }}
    #   {{- end }}
